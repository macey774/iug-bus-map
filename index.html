<!DOCTYPE html>

<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BusEye - Suivi des bus scolaires</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Google Material Icons (conservés pour les autres icônes) -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- CSS principal -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SPLASH SCREEN (image de chargement) -->
    <div id="splashScreen" class="splash-screen">
        <img src="busiug.png" alt="BusEye" class="splash-image">
        <div class="splash-text">Chargement...</div>
    </div>

    <!-- ================= HUBAR (barre fixe) ================= -->
    <div class="hubar">
        <div class="hubar-left">
            <div class="logo-area" id="header-logo">
                <img src="bus.png" alt="BusEye" class="logo-image">
                <h1 id="header-title">BusEye</h1>
            </div>
        </div>
        <div class="hubar-right">
            <button id="searchToggleBtn" class="icon-btn" title="Rechercher un arrêt" aria-label="Rechercher">
                <span class="material-icons">search</span>
            </button>
            <button id="routeBtn" class="icon-btn" title="Itinéraire" aria-label="Itinéraire">
                <span class="material-icons">directions</span>
            </button>
            <button id="menuToggle" class="icon-btn" aria-label="Menu">
                <span class="material-icons">menu</span>
            </button>
        </div>
    </div>

    <!-- Panneau de recherche expansible -->
    <div id="searchPanel" class="search-panel">
        <div class="search-panel-content">
            <div class="search-container-expandable">
                <input id="searchStop" class="search-bar-expandable" type="text" placeholder="Rechercher un arrêt..." autocomplete="off" aria-label="Rechercher un arrêt">
                <button id="searchBtnExp" class="search-btn-expandable" aria-label="Rechercher">
                    <span class="material-icons">search</span>
                </button>
            </div>
            <div id="suggestionsList" class="suggestions-list-expandable" role="listbox"></div>
        </div>
    </div>

    <!-- Menu latéral (drawer) -->
    <div id="stopsDrawer" class="stops-drawer" aria-modal="true" aria-label="Liste des arrêts" aria-hidden="true">
        <div class="drawer-header">
            <h2 class="drawer-title">
                <span class="material-icons" aria-hidden="true">map</span>
                Liste des arrêts
            </h2>
            <button id="closeDrawer" class="close-drawer" aria-label="Fermer">
                <span class="material-icons" aria-hidden="true">close</span>
            </button>
        </div>
        <div class="drawer-search">
            <span class="material-icons" aria-hidden="true">search</span>
            <input type="text" id="drawerSearchInput" placeholder="Filtrer les arrêts..." class="drawer-search-input" aria-label="Filtrer les arrêts">
        </div>
        <div class="drawer-tabs" role="tablist">
            <button class="drawer-tab active" data-tab="all" role="tab" aria-selected="true">Tous</button>
            <button class="drawer-tab" data-tab="bus4" role="tab" aria-selected="false">BUS 4</button>
            <button class="drawer-tab" data-tab="bus8" role="tab" aria-selected="false">BUS 8</button>
            <button class="drawer-tab" data-tab="favorites" role="tab" aria-selected="false">Favoris</button>
        </div>
        <div id="stopsList" class="stops-list"></div>
        <div class="drawer-footer">
            <div class="drawer-stats" id="drawerStats">Chargement...</div>
        </div>
    </div>
    <div id="drawerOverlay" class="drawer-overlay"></div>

    <!-- Fenêtre modale itinéraire -->
    <div id="routeModal" class="route-modal" aria-hidden="true" aria-label="Calcul d'itinéraire">
        <div class="route-modal-content">
            <h3>Itinéraire</h3>
            <div class="input-wrapper">
                <span class="material-icons" aria-hidden="true">my_location</span>
                <input type="text" id="startInput" value="Ma position" readonly>
            </div>
            <div class="input-wrapper">
                <span class="material-icons" aria-hidden="true">location_on</span>
                <input type="text" id="endInput" placeholder="Entrez un arrêt..." autocomplete="off" aria-label="Destination">
                <div id="endSuggestions" class="suggestions-list end-suggestions"></div>
            </div>
            <button id="traceBtn" class="trace-btn">
                <span class="material-icons" aria-hidden="true">route</span>
                Tracer
            </button>
            <button id="clearRouteBtn" class="clear-btn">
                <span class="material-icons" aria-hidden="true">highlight_off</span>
                Effacer itinéraire
            </button>
            <button id="closeRouteModal" class="close-btn" aria-label="Fermer la fenêtre itinéraire">✖</button>
        </div>
    </div>

    <main>
        <div id="map"></div>
    </main>

    <!-- Boutons flottants -->
    <button class="mobile-btn" id="locateBtn" title="Ma position" aria-label="Afficher ma position">
        <span class="material-icons" aria-hidden="true">my_location</span>
    </button>
    <button class="mobile-btn" id="followBtn" title="Suivre ma position" aria-label="Activer le suivi automatique">
        <span class="material-icons" aria-hidden="true">near_me</span>
    </button>
    <button class="mobile-btn" id="nearestStopBtn" title="Arrêt le plus proche" aria-label="Trouver l'arrêt le plus proche">
        <span class="material-icons" aria-hidden="true">location_on</span>
    </button>

    <footer class="footer">
        <div class="footer-title">Institut Universitaire du Golfe de Guinée</div>
    </footer>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
