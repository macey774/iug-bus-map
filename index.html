<!DOCTYPE html>


<html lang="fr">

<head>
    <!-- ===================================================== -->
    <!-- META CONFIGURATION -->
    <!-- ===================================================== -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>Suivi des bus scolaires</title>

    <!-- ===================================================== -->
    <!-- FEUILLES DE STYLE -->
    <!-- ===================================================== -->

    <!-- Leaflet CSS (Carte) -->
    <link rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css"
        integrity=""
        crossorigin=""/>

    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
        rel="stylesheet">

    <!-- CSS principal -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ===================================================== -->
    <!-- HEADER PRINCIPAL -->
    <!-- Contient : titre + barre de recherche -->
    <!-- ===================================================== -->
    <header class="header-container">

        <!-- Titre de l'application -->
        <h1 class="header-title">Bus scolaires</h1>

        <!-- ================= Recherche ================= -->
        <div class="search-wrapper">

            <div class="search-bar-wrapper">

                <!-- Input recherche arrêt -->
                <input
                    id="searchStop"
                    class="search-bar"
                    type="text"
                    placeholder="Rechercher un arrêt..."
                    autocomplete="off"
                    aria-label="Rechercher un arrêt"
                />

                <!-- Boutons associés à la recherche -->
                <div class="search-buttons">

                    <!-- Bouton Rechercher -->
                    <button
                        id="searchBtn"
                        class="search-btn"
                        title="Rechercher"
                        aria-label="Rechercher un arrêt">

                        <span class="material-icons">search</span>
                    </button>

                    <!-- Bouton Itinéraire -->
                    <button
                        id="routeBtn"
                        class="route-btn"
                        title="Ouvrir l'itinéraire"
                        aria-label="Ouvrir la fenêtre d'itinéraire">

                        <span class="material-icons">directions</span>
                    </button>

                </div>

            </div>

        </div>

    </header>


    <!-- ===================================================== -->
    <!-- MINI FENÊTRE ITINÉRAIRE (MODAL) -->
    <!-- ===================================================== -->
    <div id="routeModal" class="route-modal" aria-hidden="true">

        <div class="route-modal-content">

            <!-- Titre -->
            <h3>Itinéraire</h3>

            <!-- ================= Point de départ ================= -->
            <div class="input-wrapper">

                <span class="material-icons">my_location</span>

                <!-- Non modifiable -->
                <input
                    type="text"
                    id="startInput"
                    value="Ma position"
                    readonly
                />
            </div>

            <!-- ================= Destination ================= -->
            <div class="input-wrapper">

                <span class="material-icons">location_on</span>

                <input
                    type="text"
                    id="endInput"
                    placeholder="Entrez un arrêt..."
                    autocomplete="off"
                />
            </div>

            <!-- ================= Bouton Tracer ================= -->
            <button id="traceBtn" class="trace-btn">
                <span class="material-icons">route</span>
                Tracer
            </button>

            <!-- ================= Bouton Effacer ================= -->
            <button id="clearRouteBtn" class="clear-btn">
                <span class="material-icons">highlight_off</span>
                Effacer itinéraire
            </button>

            <!-- ================= Bouton Fermer ================= -->
            <button
                id="closeRouteModal"
                class="close-btn"
                aria-label="Fermer la fenêtre itinéraire">
                ✖
            </button>

        </div>
    </div>


    <!-- ===================================================== -->
    <!-- CARTE PRINCIPALE -->
    <!-- ===================================================== -->
    <main>
        <div id="map"></div>
    </main>


    <!-- ===================================================== -->
    <!-- BOUTONS FLOTTANTS (Optimisés Mobile) -->
    <!-- ===================================================== -->

    <!-- Bouton Ma position -->
    <button
        class="mobile-btn"
        id="locateBtn"
        title="Ma position"
        aria-label="Afficher ma position">

        <span class="material-icons">my_location</span>
    </button>

    <!-- Bouton Arrêt le plus proche -->
    <button
        class="mobile-btn"
        id="nearestStopBtn"
        title="Arrêt le plus proche"
        aria-label="Trouver l'arrêt le plus proche">

        <span class="material-icons">location_on</span>
    </button>


    <!-- ===================================================== -->
    <!-- FOOTER -->
    <!-- ===================================================== -->
    <footer class="footer">
        <div class="footer-title">
            Institut Universitaire du Golfe de Guinée
        </div>
    </footer>


    <!-- ===================================================== -->
    <!-- SCRIPTS -->
    <!-- ===================================================== -->

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- Script principal -->
    <script src="script.js"></script>

</body>
</html>
