<!DOCTYPE html>



<html lang="fr">
<head>
    <!-- ===================================================== -->
    <!-- META CONFIGURATION MOBILE FIRST -->
    <!-- ===================================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>Suivi des bus scolaires - Mobile</title>
    
    <!-- ===================================================== -->
    <!-- ICÔNES ET FONTS -->
    <!-- ===================================================== -->
    <link rel="apple-touch-icon" href="icon.png">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    
    <!-- ===================================================== -->
    <!-- CSS PRINCIPAL -->
    <!-- ===================================================== -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- ===================================================== -->
    <!-- HEADER MOBILE -->
    <!-- ===================================================== -->
    <header class="header-container">
        <div class="header-top">
            <button class="menu-btn" id="menuBtn" aria-label="Menu">
                <span class="material-icons">menu</span>
            </button>
            
            <h1 class="header-title">Bus IUG</h1>
            
            <button class="notif-btn" id="notifBtn" aria-label="Notifications">
                <span class="material-icons">notifications_none</span>
            </button>
        </div>

        <!-- Barre de recherche mobile -->
        <div class="search-wrapper">
            <div class="search-bar-wrapper">
                <span class="material-icons search-icon">search</span>
                <input
                    id="searchStop"
                    class="search-bar"
                    type="text"
                    placeholder="Rechercher un arrêt..."
                    autocomplete="off"
                />
                <button id="routeBtn" class="route-btn" aria-label="Itinéraire">
                    <span class="material-icons">directions</span>
                </button>
            </div>
        </div>
    </header>

    <!-- ===================================================== -->
    <!-- MENU LATÉRAL MOBILE -->
    <!-- ===================================================== -->
    <div class="side-menu" id="sideMenu">
        <div class="side-menu-header">
            <div class="user-info">
                <div class="user-avatar">
                    <span class="material-icons">account_circle</span>
                </div>
                <div class="user-details">
                    <div class="user-name">Invité</div>
                    <div class="user-email">connectez-vous</div>
                </div>
            </div>
            <button class="close-menu" id="closeMenu" aria-label="Fermer le menu">
                <span class="material-icons">close</span>
            </button>
        </div>
        
        <div class="side-menu-content">
            <div class="menu-item">
                <span class="material-icons">star</span>
                <span>Mes favoris</span>
            </div>
            <div class="menu-item">
                <span class="material-icons">history</span>
                <span>Historique</span>
            </div>
            <div class="menu-item">
                <span class="material-icons">schedule</span>
                <span>Horaires</span>
            </div>
            <div class="menu-divider"></div>
            <div class="menu-item">
                <span class="material-icons">info</span>
                <span>À propos</span>
            </div>
            <div class="menu-item">
                <span class="material-icons">settings</span>
                <span>Paramètres</span>
            </div>
        </div>
    </div>
    <div class="menu-overlay" id="menuOverlay"></div>

    <!-- ===================================================== -->
    <!-- MODAL ITINÉRAIRE MOBILE -->
    <!-- ===================================================== -->
    <div id="routeModal" class="route-modal">
        <div class="route-modal-content">
            <div class="modal-header">
                <h3>Itinéraire</h3>
                <button id="closeRouteModal" class="close-btn" aria-label="Fermer">
                    <span class="material-icons">close</span>
                </button>
            </div>
            
            <div class="modal-body">
                <div class="input-wrapper">
                    <span class="material-icons">my_location</span>
                    <input type="text" id="startInput" value="Ma position" readonly />
                </div>
                
                <div class="input-wrapper">
                    <span class="material-icons">location_on</span>
                    <input type="text" id="endInput" placeholder="Où allez-vous ?" autocomplete="off" />
                </div>
                
                <div class="suggestions-stops" id="suggestionsStops">
                    <!-- Suggestions d'arrêts apparaîtront ici -->
                </div>
                
                <div class="modal-actions">
                    <button id="traceBtn" class="trace-btn">
                        <span class="material-icons">route</span>
                        Tracer l'itinéraire
                    </button>
                    <button id="clearRouteBtn" class="clear-btn">
                        <span class="material-icons">highlight_off</span>
                        Effacer
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===================================================== -->
    <!-- CARTE PRINCIPALE -->
    <!-- ===================================================== -->
    <main>
        <div id="map"></div>
    </main>

    <!-- ===================================================== -->
    <!-- BOUTONS D'ACTION FLOTTANTS MOBILE -->
    <!-- ===================================================== -->
    <div class="fab-container">
        <button class="fab" id="locateBtn" aria-label="Ma position">
            <span class="material-icons">my_location</span>
        </button>
        
        <button class="fab" id="nearestStopBtn" aria-label="Arrêt le plus proche">
            <span class="material-icons">location_on</span>
        </button>
    </div>

    <!-- ===================================================== -->
    <!-- BOTTOM SHEET - INFOS BUS -->
    <!-- ===================================================== -->
    <div class="bottom-sheet" id="bottomSheet">
        <div class="sheet-handle"></div>
        <div class="sheet-content" id="sheetContent">
            <!-- Contenu dynamique -->
        </div>
    </div>

    <!-- ===================================================== -->
    <!-- FOOTER -->
    <!-- ===================================================== -->
    <footer class="footer">
        <div class="footer-content">
            <span>Institut Universitaire du Golfe de Guinée</span>
            <span class="version">v2.0 mobile</span>
        </div>
    </footer>

    <!-- ===================================================== -->
    <!-- SCRIPTS -->
    <!-- ===================================================== -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
