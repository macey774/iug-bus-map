<!DOCTYPE html>

<html lang="fr">

<head>
    <!-- ================= META ================= -->

    <!-- Encodage UTF-8 (important pour les accents) -->
    <meta charset="UTF-8">

    <!-- Responsive mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Titre de l'application -->
    <title>Suivi des bus scolaires</title>

    <!-- ================= LIBRAIRIES EXTERNES ================= -->

    <!-- Leaflet CSS (carte) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

    <!-- Google Material Icons (icônes modernes) -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- ================= STYLE PERSONNEL ================= -->

    <!-- Feuille de style principale -->
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- ===================================================== -->
    <!-- ======================= HEADER ====================== -->
    <!-- ===================================================== -->

    <header class="header-container">

        <!-- Titre principal -->
        <h1 class="header-title">
            Bus scolaires
        </h1>

        <!-- Barre de recherche principale -->
        <div class="search-wrapper">

            <div class="search-bar-wrapper">

                <!-- Champ de recherche d'arrêt -->
                <input 
                    id="searchStop"
                    class="search-bar"
                    placeholder="Rechercher un arrêt..."
                />

                <!-- Boutons à droite de la barre -->
                <div class="search-buttons">

                    <!-- Bouton Rechercher -->
                    <button 
                        id="searchBtn"
                        class="search-btn"
                        title="Rechercher un arrêt"
                    >
                        <span class="material-icons">search</span>
                    </button>

                    <!-- Bouton Ouvrir fenêtre itinéraire -->
                    <button 
                        id="routeBtn"
                        class="route-btn"
                        title="Ouvrir l'itinéraire"
                    >
                        <span class="material-icons">directions</span>
                    </button>

                </div>

            </div>

        </div>

    </header>


    <!-- ===================================================== -->
    <!-- ================= MINI FENÊTRE ITINÉRAIRE ============ -->
    <!-- ===================================================== -->

    <div id="routeModal" class="route-modal">

        <div class="route-modal-content">

            <!-- Titre de la fenêtre -->
            <h3>Itinéraire</h3>

            <!-- ================= POINT DE DÉPART ================= -->
            <!-- Toujours "Ma position" (non modifiable) -->
            <div class="input-wrapper">
                <span class="material-icons">my_location</span>

                <input 
                    type="text"
                    id="startInput"
                    value="Ma position"
                    readonly
                />
            </div>

            <!-- ================= DESTINATION ================= -->
            <!-- L'utilisateur saisit un arrêt -->
            <div class="input-wrapper">
                <span class="material-icons">location_on</span>

                <input 
                    type="text"
                    id="endInput"
                    placeholder="Entrez un arrêt..."
                />
            </div>

            <!-- ================= BOUTON TRACER ================= -->
            <!-- Lance le calcul d'itinéraire -->
            <button id="traceBtn" class="trace-btn">
                <span class="material-icons">route</span>
                Tracer
            </button>

            <!-- ================= BOUTON EFFACER ================= -->
            <!-- Supprime ligne + position -->
            <button id="clearRouteBtn" class="clear-btn">
                <span class="material-icons">highlight_off</span>
                Effacer itinéraire
            </button>

            <!-- ================= BOUTON FERMER ================= -->
            <!-- Ferme simplement la mini fenêtre -->
            <button id="closeRouteModal" class="close-btn">
                ✖
            </button>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- ======================= CARTE ======================== -->
    <!-- ===================================================== -->

    <!-- Conteneur principal Leaflet -->
    <div id="map"></div>


    <!-- ===================================================== -->
    <!-- ================= BOUTONS FLOTTANTS ================= -->
    <!-- ===================================================== -->

    <!-- Bouton flottant : Ma position -->
    <div 
        class="mobile-btn"
        id="locateBtn"
        title="Afficher ma position"
    >
        <span class="material-icons">my_location</span>
    </div>

    <!-- Bouton flottant : Arrêt le plus proche -->
    <div 
        class="mobile-btn"
        id="nearestStopBtn"
        title="Trouver l'arrêt le plus proche"
    >
        <span class="material-icons">location_on</span>
    </div>


    <!-- ===================================================== -->
    <!-- ======================= FOOTER ======================= -->
    <!-- ===================================================== -->

    <footer class="footer">
        <div class="footer-title">
            Institut Universitaire du Golfe de Guinée
        </div>
    </footer>


    <!-- ===================================================== -->
    <!-- ======================= SCRIPTS ====================== -->
    <!-- ===================================================== -->

    <!-- Leaflet JS (carte interactive) -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- Script principal de l'application -->
    <script src="script.js"></script>

</body>
</html>
