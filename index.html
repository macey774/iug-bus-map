<!DOCTYPE html>


<html lang="fr">

<head>
    <!-- ===================================================== -->
    <!-- META CONFIGURATION -->
    <!-- ===================================================== -->

    <meta charset="UTF-8">

    <!-- Optimisation mobile + gestion du zoom propre -->
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Suivi des bus scolaires</title>

    <!-- ===================================================== -->
    <!-- FEUILLES DE STYLE -->
    <!-- ===================================================== -->

    <!-- Leaflet CSS (Carte) -->
    <link rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css"
        integrity=""
        crossorigin=""/>

    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
        rel="stylesheet">

    <!-- CSS principal -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ===================================================== -->
<!-- HEADER PRINCIPAL -->
<!-- Contient : titre + barre de recherche améliorée -->
<!-- ===================================================== -->
<header class="header-container">

    <!-- Titre de l'application -->
    <h1 class="header-title">Bus scolaires</h1>

    <!-- ================= Recherche améliorée ================= -->
    <div class="search-wrapper">

        <div class="search-bar-wrapper">

            <!-- Bouton hamburger pour afficher la liste des arrêts -->
            <button 
                id="menuToggle" 
                class="menu-toggle" 
                aria-label="Afficher la liste des arrêts"
                title="Liste des arrêts">
                <span class="material-icons">menu</span>
            </button>

            <!-- Input recherche arrêt avec autocomplete -->
            <div class="search-container">
                <input
                    id="searchStop"
                    class="search-bar"
                    type="text"
                    placeholder="Rechercher un arrêt..."
                    autocomplete="off"
                    aria-label="Rechercher un arrêt"
                />
                
                <!-- Liste déroulante des suggestions (autocomplete) -->
                <div id="suggestionsList" class="suggestions-list"></div>
            </div>

            <!-- Boutons associés à la recherche -->
            <div class="search-buttons">
                <!-- Bouton Rechercher -->
                <button
                    id="searchBtn"
                    class="search-btn"
                    title="Rechercher"
                    aria-label="Rechercher un arrêt">
                    <span class="material-icons">search</span>
                </button>

                <!-- Bouton Itinéraire -->
                <button
                    id="routeBtn"
                    class="route-btn"
                    title="Ouvrir l'itinéraire"
                    aria-label="Ouvrir la fenêtre d'itinéraire">
                    <span class="material-icons">directions</span>
                </button>
            </div>

        </div>

    </div>

</header>

<!-- ===================================================== -->
<!-- MENU LATÉRAL (DRAWER) POUR LA LISTE COMPLÈTE DES ARRÊTS -->
<!-- ===================================================== -->
<div id="stopsDrawer" class="stops-drawer">
    <div class="drawer-header">
        <h2 class="drawer-title">
            <span class="material-icons">map</span>
            Liste des arrêts
        </h2>
        <button id="closeDrawer" class="close-drawer" aria-label="Fermer">
            <span class="material-icons">close</span>
        </button>
    </div>
    
    <div class="drawer-search">
        <span class="material-icons">search</span>
        <input 
            type="text" 
            id="drawerSearchInput" 
            placeholder="Filtrer les arrêts..." 
            class="drawer-search-input"
        />
    </div>
    
    <div class="drawer-tabs">
        <button class="drawer-tab active" data-tab="all">Tous</button>
        <button class="drawer-tab" data-tab="bus4">BUS 4</button>
        <button class="drawer-tab" data-tab="bus8">BUS 8</button>
        <button class="drawer-tab" data-tab="favorites">Favoris</button>
    </div>
    
    <div id="stopsList" class="stops-list">
        <!-- La liste des arrêts sera générée dynamiquement -->
    </div>
    
    <div class="drawer-footer">
        <div class="drawer-stats" id="drawerStats">
            Chargement...
        </div>
    </div>
</div>

<!-- Overlay pour le drawer -->
<div id="drawerOverlay" class="drawer-overlay"></div>
    <!-- ===================================================== -->
    <!-- MINI FENÊTRE ITINÉRAIRE (MODAL) -->
    <!-- ===================================================== -->
    <div id="routeModal" class="route-modal" aria-hidden="true">

        <div class="route-modal-content">

            <!-- Titre -->
            <h3>Itinéraire</h3>

            <!-- ================= Point de départ ================= -->
            <div class="input-wrapper">

                <span class="material-icons">my_location</span>

                <!-- Non modifiable -->
                <input
                    type="text"
                    id="startInput"
                    value="Ma position"
                    readonly
                />
            </div>

            <!-- ================= Destination ================= -->
            <div class="input-wrapper">

                <span class="material-icons">location_on</span>

                <input
                    type="text"
                    id="endInput"
                    placeholder="Entrez un arrêt..."
                    autocomplete="off"
                />
            </div>

            <!-- ================= Bouton Tracer ================= -->
            <button id="traceBtn" class="trace-btn">
                <span class="material-icons">route</span>
                Tracer
            </button>

            <!-- ================= Bouton Effacer ================= -->
            <button id="clearRouteBtn" class="clear-btn">
                <span class="material-icons">highlight_off</span>
                Effacer itinéraire
            </button>

            <!-- ================= Bouton Fermer ================= -->
            <button
                id="closeRouteModal"
                class="close-btn"
                aria-label="Fermer la fenêtre itinéraire">
                ✖
            </button>

        </div>
    </div>


    <!-- ===================================================== -->
    <!-- CARTE PRINCIPALE -->
    <!-- ===================================================== -->
    <main>
        <div id="map"></div>
    </main>


    <!-- ===================================================== -->
    <!-- BOUTONS FLOTTANTS (Optimisés Mobile) -->
    <!-- ===================================================== -->

    <!-- Bouton Ma position -->
    <button
        class="mobile-btn"
        id="locateBtn"
        title="Ma position"
        aria-label="Afficher ma position">

        <span class="material-icons">my_location</span>
    </button>

    <!-- Bouton Arrêt le plus proche -->
    <button
        class="mobile-btn"
        id="nearestStopBtn"
        title="Arrêt le plus proche"
        aria-label="Trouver l'arrêt le plus proche">

        <span class="material-icons">location_on</span>
    </button>


    <!-- ===================================================== -->
    <!-- FOOTER -->
    <!-- ===================================================== -->
    <footer class="footer">
        <div class="footer-title">
            Institut Universitaire du Golfe de Guinée
        </div>
    </footer>


    <!-- ===================================================== -->
    <!-- SCRIPTS -->
    <!-- ===================================================== -->

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- Script principal -->
    <script src="script.js"></script>

</body>
</html>
