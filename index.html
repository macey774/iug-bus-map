<html lang="fr">
<head>
    <meta charset="UTF-8">

    <!-- IMPORTANT : pour mobile + accents -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Suivi des bus scolaires</title>

    <!-- ================= Leaflet CSS ================= -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

    <!-- ================= Google Material Icons ================= -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- ================= CSS principal ================= -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= HEADER ================= -->
<header class="header-container">
    <!-- Titre du site -->
    <h1 class="header-title">Bus scolaires</h1>

    <!-- Barre de recherche + boutons -->
    <div class="search-wrapper">
        <div class="search-bar-wrapper">
            <!-- Input principal pour rechercher un arrêt -->
            <input id="searchStop" class="search-bar" placeholder="Rechercher un arrêt..." />
            
            <!-- Boutons à droite de l'input -->
            <div class="search-buttons">
                <!-- Bouton Recherche -->
                <button id="searchBtn" class="search-btn" title="Rechercher">
                    <span class="material-icons">search</span>
                </button>

                <!-- Bouton Itinéraire -->
                <button id="routeBtn" class="route-btn" title="Itinéraire">
                    <span class="material-icons">directions</span>
                </button>
            </div>
        </div>
    </div>
</header>

<!-- ================= MINI FENÊTRE ITINÉRAIRE ================= -->
<div id="routeModal" class="route-modal">
    <div class="route-modal-content">
        <!-- Titre -->
        <h3>Itinéraire</h3>

        <!-- Point de départ (non modifiable) -->
        <div class="input-wrapper">
            <span class="material-icons">my_location</span>
            <input type="text" id="startInput" value="Ma position" readonly />
        </div>

        <!-- Arrêt de destination (modifiable) -->
        <div class="input-wrapper">
            <span class="material-icons">location_on</span> <!-- icône “pin” pour l’arrêt -->
            <input type="text" id="endInput" placeholder="Entrez un arrêt..." />
        </div>

        <!-- Bouton Tracer l'itinéraire -->
        <button id="traceBtn" class="trace-btn">
            <span class="material-icons">route</span>
            Tracer
        </button>
      
              <!-- Bouton Effacer -->
        <button id="clearRouteBtn" class="clear-btn">
            <span class="material-icons">delete</span>
            Effacer itinéraire
        </button>


        <!-- Bouton Fermer -->
        <button id="closeRouteModal" class="close-btn">?</button>
    </div>
</div>

<!-- ================= CARTE LEAFLET ================= -->
<div id="map"></div>

<!-- ================= BOUTONS FLOTTANTS MOBILE ================= -->
<div class="mobile-btn" id="locateBtn" title="Ma position">
    <span class="material-icons">my_location</span>
</div>
<div class="mobile-btn" id="nearestStopBtn" title="Arrêt le plus proche">
    <span class="material-icons">location_on</span>
</div>

<!-- ================= FOOTER ================= -->
<footer class="footer">
    <div class="footer-title">Institut Universitaire du Golfe de Guinée</div>
</footer>

<!-- ================= SCRIPTS ================= -->
<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- JS principal -->
<script src="script.js"></script>

</body>
</html>
